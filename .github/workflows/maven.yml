name: Java CI with Maven

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin' # azul??
          cache: maven
      - name: Build with Maven
        run: ./mvnw -B --file pom.xml clean compile test
      - name: packages with Maven
        run: ./mvnw -B --file pom.xml package
